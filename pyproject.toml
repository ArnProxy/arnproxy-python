[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arnproxy-sdk"
version = "1.1.1"
description = "ARNPROXY customer API client"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"

[tool.setuptools]
packages = ["arnproxy"]

[tool.setuptools.package-data]
arnproxy = ["resources.json"]
